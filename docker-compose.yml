services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cv-generator-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  minio:
    image: minio/minio
    container_name: cv-generator-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_storage:/data
    command: server /data --console-address ":9001"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cv-generator-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_db:/app/db
    env_file:
      - .env
    depends_on:
      - qdrant
      - redis
      - minio
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cv-generator-worker
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
      - backend_db:/app/db
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    restart: always

  redis:
    image: redis:alpine
    container_name: cv-generator-redis
    ports:
      - "6379:6379"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cv-generator-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - backend
    restart: always

volumes:
  qdrant_storage:
  backend_db:
  minio_storage:
